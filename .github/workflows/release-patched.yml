name: Release patched Deno

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*nikicat*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake

      - name: Build
        run: cargo build --release --locked --bin deno --bin denort --bin test_server

      - name: Test
        run: |
          cargo test --release --locked -p deno_config
          cargo test --release --locked -p specs_tests fmt

      - name: Package
        run: |
          cd target/release
          zip -9 deno-${{ matrix.target }}.zip deno

      - uses: actions/upload-artifact@v4
        with:
          name: deno-${{ matrix.target }}
          path: target/release/deno-${{ matrix.target }}.zip
          if-no-files-found: error

      # Mirror the zip into R2 at the path layout dvm expects:
      #   {registry}release/v{version}/deno-{target}.zip
      # so `dvm registry binary set <r2-public-url>` + `dvm install <ver>` works.
      # Skips silently until the R2_* secrets are configured.
      - name: Mirror to R2 for dvm
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2 secrets not set, skipping mirror"; exit 0
          fi
          ver="${GITHUB_REF_NAME#v}"   # v2.8.3+nikicat0 -> 2.8.3+nikicat0
          key="release/v${ver}/deno-${{ matrix.target }}.zip"
          aws s3 cp "target/release/deno-${{ matrix.target }}.zip" \
            "s3://${R2_BUCKET}/${key}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Mirrored to R2: ${key}"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
